jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: divinespark-backend   # <--- Add this line

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test
        run: mvn -B test
